name: SciML arXiv digest

on:
  workflow_dispatch: {}
  schedule:
    # arXiv's RSS feed is refreshed around midnight US Eastern, Mon-Fri.
    # 05:30 UTC Mon-Fri = 14:30 KST.
    - cron: '30 5 * * 1-5'

jobs:
  generate_and_send_digest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-sciml.txt
    # Persist the list of already-screened papers between runs (history/ is not committed).
    # Each run saves a new cache entry; restore-keys picks the most recent one.
    - name: Restore paper history
      uses: actions/cache/restore@v4
      with:
        path: history
        key: seen-papers-${{ github.run_id }}
        restore-keys: seen-papers-
    - name: Generate and email digest
      run: python src/sciml_digest.py
      env:
        # Set at least one LLM key as a repository secret.
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Optional: SMTP email (e.g. Gmail address + app password).
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        TO_EMAIL: ${{ secrets.TO_EMAIL }}
    - name: Save paper history
      if: success()
      uses: actions/cache/save@v4
      with:
        path: history
        key: seen-papers-${{ github.run_id }}
    - name: Upload digest
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sciml-digest
        path: digest/sciml_digest_*.html
        if-no-files-found: ignore
